name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cadeau: ${{ steps.filter.outputs.cadeau }}
      temp: ${{ steps.filter.outputs.temp }}
      movie-choice: ${{ steps.filter.outputs.movie-choice }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cadeau:
              - 'cadeau/**'
            temp:
              - 'temp/**'
            movie-choice:
              - 'movie-choice/**'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && !cancelled()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        run: |
          mkdir -p _site

          if [ -d "cadeau" ]; then
            cp -r cadeau _site/
            echo "✓ Copied /cadeau"
          fi

          if [ -d "temp" ]; then
            cp -r temp _site/
            echo "✓ Copied /temp"
          fi

          if [ -d "movie-choice" ]; then
            cp -r movie-choice _site/
            echo "✓ Copied /movie-choice"
          fi

          touch _site/.nojekyll
          
          echo "Deployment directory contents:"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
