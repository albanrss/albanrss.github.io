name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cadeau: ${{ steps.filter.outputs.cadeau }}
      temp: ${{ steps.filter.outputs.temp }}
      doc-rtype: ${{ steps.filter.outputs.doc-rtype }}
      movieChoice: ${{ steps.filter.outputs.movieChoice }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cadeau:
              - 'cadeau/**'
            temp:
              - 'temp/**'
            doc-rtype:
              - 'doc-rtype/**'
              - '.github/workflows/deploy-docs.yml'
            movieChoice:
              - 'movie-choice/**'

  build-docusaurus:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.doc-rtype == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: doc-rtype/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('doc-rtype/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: doc-rtype
        run: npm ci

      - name: Build Docusaurus
        working-directory: doc-rtype
        run: npm run build

      - name: Upload Docusaurus artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-rtype-build
          path: doc-rtype/build

  deploy:
    runs-on: ubuntu-latest
    needs: [changes, build-docusaurus]
    if: always() && !cancelled()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docusaurus build
        if: needs.changes.outputs.doc-rtype == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: doc-rtype-build
          path: _site/doc-rtype
        continue-on-error: true

      - name: Prepare deployment directory
        run: |
          mkdir -p _site

          if [ -d "cadeau" ]; then
            cp -r cadeau _site/
            echo "✓ Copied /cadeau"
          fi

          if [ -d "temp" ]; then
            cp -r temp _site/
            echo "✓ Copied /temp"
          fi

          if [ ! -d "_site/doc-rtype" ] && [ -d "doc-rtype/build" ]; then
            cp -r doc-rtype/build _site/doc-rtype
            echo "✓ Using existing doc-rtype build"
          fi

          if [ -d "movie-choice" ]; then
            cp -r movie-choice _site/
            echo "✓ Copied /movie-choice"
          fi

          touch _site/.nojekyll
          
          echo "Deployment directory contents:"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
